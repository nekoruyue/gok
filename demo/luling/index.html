<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#171e21">
<title>戈克世界·鹿铃亭</title>
<link rel="stylesheet" href="css/main.css?v=2026111501">
</head>
<body>
<div id="app">
  <!-- 顶栏：金币 / 日期 / 体力（M5.1 星露谷式） -->
  <header id="hud">
    <div class="hud-left">
      <span class="hud-coin"><i class="coin-dot"></i><b id="hud-money">500</b></span>
      <span class="hud-sep"></span>
      <span id="hud-fame" class="hud-fame">账 0</span>
    </div>
    <div id="hud-day" class="hud-date">第 1 天 · 春 · 晴</div>
    <div class="hud-right">
      <div class="hud-stam" title="体力">
        <i id="hud-stam-fill"></i>
        <span id="hud-stam-text">100/100</span>
      </div>
      <button id="hud-mute" class="hud-sound" data-act="toggle-muted" title="声音">🔊</button>
      <button id="hud-quit" data-act="quit">退出</button>
    </div>
  </header>

  <main id="scene">
    <canvas id="map" class="hidden"></canvas>
    <canvas id="shop" class="hidden"></canvas>
    <div id="scene-dom"></div>
    <div id="map-hint" class="hidden"></div>
    <!-- 右侧日子卡（M5.1） -->
    <aside id="daycard" class="hidden"></aside>
    <!-- 底部快捷栏（M5.1） -->
    <div id="hotbar" class="hidden"></div>
    <!-- 右下功能键组（M5.1） -->
    <div id="fnkeys" class="hidden"></div>
  </main>

  <footer id="actions"></footer>
</div>
<div id="modal" class="hidden"><div id="modal-box"></div></div>
<div id="rotate-hint">
  <div class="rotate-phone"></div>
  <p class="rotate-title">请把手机横过来</p>
  <p class="rotate-sub">鹿铃亭要横着开门</p>
</div>
<script src="js/data.js?v=2026111501"></script>
<script src="js/state.js?v=2026111501"></script>
<script src="js/sfx.js?v=2026111501"></script>
<script src="js/map.js?v=2026111501"></script>
<script src="js/shop.js?v=2026111501"></script>
<script src="js/game.js?v=2026111501"></script>
</body>
</html>
